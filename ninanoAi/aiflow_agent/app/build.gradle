apply plugin: 'com.android.application'
//apply plugin: 'android-apt'
//apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-android-extensions'
//apply plugin: 'com.neenbedankt.android-apt'       //deprecate


android {
    compileSdkVersion 25
    buildToolsVersion '28.0.3'

    defaultConfig {
        //applicationId 'ai.api.sample'
        applicationId 'com.ninano.karaoke.aiflow'
        minSdkVersion 19
        targetSdkVersion 25
        versionName project.VERSION_NAME
//        jackOptions {
//            enabled true
//        }
    }
    buildTypes {
        release {
            //proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }

    packagingOptions {
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8

    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    compile project(':ailib')
    compile 'com.android.support:appcompat-v7:25.0.1'
    // compile 'ai.api:sdk:2.0.7@aar'
    // this line is for testing purposes
    compile 'com.github.bumptech.glide:glide:3.6.0'
    //RxJava
    compile 'io.reactivex.rxjava2:rxjava:2.1.3'
    compile 'io.reactivex.rxjava2:rxandroid:2.0.2'
    //Utils
    compile 'com.jakewharton.rxbinding2:rxbinding:2.0.0'
    //RxLifeCycle
    //    implementation 'com.trello.rxlifecycle2:rxlifecycle:2.1.0'
    //    implementation 'com.trello.rxlifecycle2:rxlifecycle-android:2.1.0'
    //    implementation 'com.trello.rxlifecycle2:rxlifecycle-components:2.1.0'
    //Utils
    compile 'com.jakewharton:butterknife:8.8.1'
    //    annotationProcessor 'com.jakewharton:butterknife-compiler:8.8.1'
    //
    //    compile "org.jetbrains.kotlin:kotlin-stdlib-jre7:$kotlin_version"
    //    compile "org.jetbrains.anko:anko-commons:$anko_version"
}
